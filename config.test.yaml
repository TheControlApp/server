# Test configuration for ControlMe Go Backend
environment: development

server:
  port: 8080
  host: localhost
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 60s

database:
  type: sqlite
  path: data/controlme.db

auth:
  jwt_secret: "test-jwt-secret-key-for-development"

websocket:
  max_connections_per_user: 3
  ping_interval: 30s
  pong_timeout: 60s
  write_wait: 10s
  read_buffer_size: 1024
  write_buffer_size: 1024

cors:
  enabled: true
  allowed_origins:
    - "http://localhost:3000"
    - "http://localhost:8080"
    - "http://127.0.0.1:3000"
  allowed_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  allowed_headers:
    - "Content-Type"
    - "Authorization"
    - "X-Requested-With"
  allow_credentials: true

logging:
  level: info
  format: json